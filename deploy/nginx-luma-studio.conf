# Luma Studio на отдельном порту, рядом с ботом (его конфиг не меняется).
# Установка на сервере: sudo cp deploy/nginx-luma-studio.conf /etc/nginx/sites-available/luma-studio
#   sudo ln -s /etc/nginx/sites-available/luma-studio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 8080;
    server_name _;
    root /var/www/luma-studio;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri /index.html;
    }
}
