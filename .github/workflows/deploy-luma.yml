name: Публикация Luma Studio

# Сборка и загрузка на сервер рядом с ботом. Нужны секреты репозитория:
#   DEPLOY_HOST        адрес сервера, например 168.113.173.108
#   DEPLOY_USER        пользователь с правом записи в /var/www/luma-studio
#   DEPLOY_SSH_KEY     приватный ключ, публичная часть которого лежит в ~/.ssh/authorized_keys
on:
  push:
    branches: [main]
    paths: ["frontend/**", "package.json", "package-lock.json", ".github/workflows/deploy-luma.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-luma
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Запомнить ключ сервера
        run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Загрузить сборку
        run: |
          rsync -az --delete frontend/dist/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/luma-studio/"
