name: Поиск трейлеров

# Раз в неделю ищет официальные трейлеры и открывает pull request с кандидатами.
# В приложение попадают только кандидаты со status: "approved" после публикации.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Найти кандидатов
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/find-trailers.mjs

      - name: Открыть pull request, если кандидаты изменились
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- scripts/trailer-candidates.json; then
            echo "Изменений нет"
            exit 0
          fi
          branch="auto/trailers-$(date +%Y-%m-%d)"
          git config user.name "luma-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add scripts/trailer-candidates.json
          git commit -m "Кандидаты трейлеров: $(date +%Y-%m-%d)"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Кандидаты трейлеров: $(date +%Y-%m-%d)" \
            --body "Проверьте кандидатов в scripts/trailer-candidates.json и поставьте status: \"approved\" у подходящих. Затем запустите node scripts/find-trailers.mjs --publish."
